[package]
name = "sa-token-plugin-tonic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tonic gRPC framework integration for sa-token-rust - All-in-one package"

[dependencies]
sa-token-plugin-common = { workspace = true }
sa-token-core = { workspace = true }
sa-token-adapter = { workspace = true }
sa-token-macro = { workspace = true }

sa-token-storage-memory = { workspace = true, optional = true }
sa-token-storage-redis = { workspace = true, optional = true }
sa-token-storage-database = { workspace = true, optional = true }

tokio = { workspace = true }
async-trait = { workspace = true }

tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

tower = { version = "0.5", optional = true }
http-body = { version = "1.0", optional = true }

http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
default = ["tonic-012", "memory"]
tonic-012 = ["dep:tonic", "dep:prost", "dep:tower", "dep:http-body"]
memory = ["dep:sa-token-storage-memory"]
redis = ["dep:sa-token-storage-redis"]
database = ["dep:sa-token-storage-database"]
full = ["memory", "redis", "database"]

[package.metadata.docs.rs]
features = ["memory", "redis", "database"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
