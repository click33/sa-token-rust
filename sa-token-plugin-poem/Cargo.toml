[package]
name = "sa-token-plugin-poem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Poem framework integration for sa-token-rust - All-in-one package"

[dependencies]
# 核心依赖（重新导出给用户）
sa-token-plugin-common = { workspace = true }
sa-token-core = { workspace = true }
sa-token-adapter = { workspace = true }
sa-token-macro = { workspace = true }

# 存储实现（可选，通过 feature 控制）
sa-token-storage-memory = { workspace = true, optional = true }
sa-token-storage-redis = { workspace = true, optional = true }
sa-token-storage-database = { workspace = true, optional = true }

# Poem 框架依赖
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
poem-03 = { package = "poem", version = "3", optional = true }
urlencoding = "2.1.3"

[features]
default = ["poem-03", "memory"]
poem-03 = ["dep:poem-03"]
# 存储后端选择
memory = ["dep:sa-token-storage-memory"]
redis = ["dep:sa-token-storage-redis"]
database = ["dep:sa-token-storage-database"]
# 包含所有存储后端
full = ["memory", "redis", "database"]

[package.metadata.docs.rs]
features = ["memory", "redis", "database"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
