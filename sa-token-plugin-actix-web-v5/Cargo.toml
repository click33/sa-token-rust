[package]
name = "sa-token-plugin-actix-web-v5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Placeholder for future actix-web 5.x bindings"

[dependencies]
sa-token-plugin-common = { workspace = true }

sa-token-storage-memory = { workspace = true, optional = true }
sa-token-storage-redis = { workspace = true, optional = true }
sa-token-storage-database = { workspace = true, optional = true }

[features]
default = []
memory = ["dep:sa-token-storage-memory"]
redis = ["dep:sa-token-storage-redis"]
database = ["dep:sa-token-storage-database"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
